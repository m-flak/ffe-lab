name: Agent evals

# Runs the real agents (Claude) when their prompts or the eval code change, and
# fails the PR if they score worse than evals/baselines/. Needs the repository
# secret ANTHROPIC_API_KEY; without it the job is skipped with a warning.
# Cost is shown in each report; the gate fails a run over $2 per dataset.

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - "src/ffelab/evals/**"
      - "src/ffelab/models.py"
      - "evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate"
        default: "claude-opus-5-5"

jobs:
  agents:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; agent evals skipped. Add it under Settings > Secrets and variables > Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - if: steps.key.outputs.present == 'true'
        run: pip install -e ".[evals]"
      - name: Blind labeller
        if: steps.key.outputs.present == 'true'
        run: |
          ffelab eval run --solver claude --model "$MODEL" --dataset evals/datasets/smoke_blind.jsonl --out reports/blind-labeller.json
          ffelab eval gate --report reports/blind-labeller.json --baseline evals/baselines/blind-labeller.json
      - name: Red team
        if: steps.key.outputs.present == 'true' && !cancelled()
        run: |
          ffelab eval run --solver claude --model "$MODEL" --dataset evals/datasets/smoke_redteam.jsonl --out reports/red-team.json
          ffelab eval gate --report reports/red-team.json --baseline evals/baselines/red-team.json
      - name: Summary
        if: steps.key.outputs.present == 'true' && !cancelled()
        run: |
          {
            echo "## Agent evals ($MODEL)"
            for r in reports/*.json; do echo; echo "### $(basename "$r" .json)"; echo; ffelab eval compare "$r"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && !cancelled()
        with:
          name: eval-reports
          path: reports/
